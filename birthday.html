<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 · flying</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:        #E4C37E;
    --gold-deep:   #C9A24B;
    --gold-soft:   #D9B56A;
    --cream:       #F6EFE2;
    --cream-deep:  #E9DEC7;
    --ivory:       #FFFDF8;
    --text:        #F3EBD9;
    --text-soft:   #C9BEa6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    font-family:'Noto Serif SC', serif;
    color:var(--text);
    background:#0D1320;
    overflow-x:hidden;
  }

  /* 夜空 */
  .sky{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 50% -12%, #2B3452 0%, rgba(43,52,82,0) 55%),
      radial-gradient(ellipse at 78% 22%, rgba(201,162,75,.10) 0%, rgba(201,162,75,0) 42%),
      linear-gradient(180deg, #141B2D 0%, #1B2337 48%, #0C111E 100%);
  }

  /* 烟花画布 */
  #fireworks{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* 星星 */
  .star{
    position:fixed; z-index:2; border-radius:50%;
    background:#F5EAD2;
    pointer-events:none;
    animation:twinkle var(--d,3s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.8); }
    50%    { opacity:var(--op,.9); transform:scale(1); }
  }

  /* ============ 内容 ============ */
  .content{
    position:relative; z-index:10;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    padding:6vh 22px 7vh;
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-weight:500; font-size:clamp(.8rem, 2.4vw, 1rem);
    letter-spacing:.55em; padding-left:.55em;
    text-transform:uppercase;
    color:var(--gold-deep);
    animation:riseIn 1.1s .1s ease both;
  }
  .title{
    font-weight:300;
    font-size:clamp(3.4rem, 13vw, 7.2rem);
    letter-spacing:.08em;
    line-height:1.12;
    margin-top:.14em;
    background:linear-gradient(180deg, #FBF3DE 12%, #E8CB8C 72%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 18px rgba(228,195,126,.25));
    animation:riseIn 1.1s .24s ease both;
  }
  .name{
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:500;
    font-size:clamp(1.9rem, 5.6vw, 2.9rem);
    color:var(--gold);
    letter-spacing:.03em;
    margin-top:.15em;
    animation:riseIn 1.1s .38s ease both;
  }

  /* ============ 蛋糕 ============ */
  .cake-wrap{
    position:relative;
    width:min(330px, 84vw);
    height:300px;
    margin-top:3.5vh;
    animation:riseIn 1.2s .5s ease both;
  }
  .cake-wrap::after{  /* 烛光地面光晕 */
    content:''; position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    width:150%; height:150%;
    background:radial-gradient(circle, rgba(255,172,74,.24), transparent 62%);
    filter:blur(12px);
    pointer-events:none;
    animation:glowPulse 3.4s ease-in-out infinite;
  }
  .cake{ position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:100%; height:230px; }

  .tray{
    position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    width:112%; height:16px; border-radius:50%;
    background:linear-gradient(180deg,#E2C07A,#A9813A);
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }

  .layer{
    position:absolute; left:50%; transform:translateX(-50%);
    border-radius:12px 12px 9px 9px;
    box-shadow:inset 0 -10px 0 rgba(0,0,0,.05);
  }
  .layer-3{ bottom:18px;  width:97%;  height:66px;
    background:linear-gradient(180deg,#F7F0E4,#E7DBC3); }
  .layer-2{ bottom:82px;  width:79%;  height:60px;
    background:linear-gradient(180deg,#FBF5EA,#EBE0CA); }
  .layer-1{ bottom:140px; width:60%;  height:54px;
    background:linear-gradient(180deg,#FFFDF8,#F0E6D1); }

  /* 每层底部金色细线 */
  .layer::after{
    content:''; position:absolute; left:8%; right:8%; bottom:2px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    opacity:.7;
  }
  /* 奶油顶 */
  .layer::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:106%; height:19px; border-radius:10px;
    background:linear-gradient(180deg,#FFFFFF,#F2E9D6);
    box-shadow:0 2px 0 rgba(201,162,75,.18);
  }
  /* 糖粒 */
  .dot{ position:absolute; width:5px; height:5px; border-radius:50%; z-index:2; }

  /* ============ 蜡烛 ============ */
  .candles{
    position:absolute; left:50%; bottom:186px; transform:translateX(-50%);
    display:flex; gap:22px; align-items:flex-end;
  }
  .candle{ position:relative; width:11px; height:48px; }
  .candle .stick{
    position:absolute; bottom:0; width:100%; height:100%;
    background:linear-gradient(180deg,#FFFDF8,#EFE6D2);
    border-radius:3px 3px 2px 2px;
    box-shadow:inset 0 0 0 1px rgba(201,162,75,.35);
  }
  .candle .wick{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    width:2px; height:6px; background:#3a2c1a; border-radius:1px;
  }
  .candle .glow{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,176,74,.5), rgba(255,176,74,0) 68%);
    filter:blur(5px);
    animation:glowPulse 2.2s ease-in-out infinite;
  }
  .candle:nth-child(2) .glow{ animation-delay:.7s; }
  .candle:nth-child(3) .glow{ animation-delay:1.3s; }
  .candle .flame{
    position:absolute; bottom:100%; left:50%;
    width:13px; height:22px; margin-bottom:2px;
    transform:translateX(-50%) rotate(45deg);
    transform-origin:center bottom;
    background:radial-gradient(circle at 50% 82%, #FFF6D8 0%, #FFE08A 40%, #FFA53D 72%, rgba(255,140,40,0) 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;
    animation:flicker 1.15s ease-in-out infinite;
  }
  .candle .flame::after{  /* 内焰（微蓝） */
    content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%) rotate(45deg);
    width:6px; height:11px; border-radius:50%;
    background:radial-gradient(circle, #CFE8FF 0%, rgba(207,232,255,.4) 60%, transparent 100%);
  }
  .candle:nth-child(2) .flame{ animation-delay:.35s; }
  .candle:nth-child(3) .flame{ animation-delay:.7s; }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) rotate(45deg) scale(1); }
    28%    { transform:translateX(-50%) rotate(43deg) scale(1.06,1.1); }
    52%    { transform:translateX(-50%) rotate(47deg) scale(.94,.97); }
    76%    { transform:translateX(-50%) rotate(44deg) scale(1.08,.9); }
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.7;  transform:translateX(-50%) scale(1); }
    50%    { opacity:1;   transform:translateX(-50%) scale(1.12); }
  }

  .tagline{
    margin-top:3.2vh;
    font-weight:300;
    font-size:clamp(1rem, 3.4vw, 1.3rem);
    letter-spacing:.1em;
    color:var(--text-soft);
    animation:riseIn 1.1s .7s ease both;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(22px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* ============ 音乐按钮 ============ */
  .music{
    position:fixed; right:28px; bottom:28px; z-index:60;
    width:54px; height:54px; border-radius:50%;
    background:rgba(20,26,42,.6);
    border:1px solid rgba(228,195,126,.5);
    color:var(--gold);
    cursor:pointer;
    display:grid; place-items:center;
    backdrop-filter:blur(6px);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .music:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(0,0,0,.35); }
  .music svg{ width:24px; height:24px; }
  .music .note{ display:none; }
  .music .play{ display:block; }
  .music.playing .note{ display:block; }
  .music.playing .play{ display:none; }
  .music.playing::after{
    content:''; position:absolute; inset:-3px; border-radius:50%;
    border:1px solid rgba(228,195,126,.4);
    animation:ring 2.6s ease-out infinite;
  }
  @keyframes ring{
    0%  { transform:scale(1); opacity:.8; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .music-hint{
    position:fixed; right:26px; bottom:90px; z-index:60;
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:.92rem; color:var(--gold-deep);
    opacity:0; transform:translateY(8px);
    transition:opacity .7s ease, transform .7s ease;
    pointer-events:none;
  }
  .music-hint.show{ opacity:.85; transform:translateY(0); }

  @media (max-width:480px){
    .music{ right:20px; bottom:20px; width:48px; height:48px; }
    .music-hint{ right:18px; bottom:76px; }
    .candles{ gap:16px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <main class="content">
    <p class="eyebrow">Happy Birthday</p>
    <h1 class="title">生日快乐</h1>
    <p class="name" id="name">flying</p>

    <div class="cake-wrap">
      <div class="cake">
        <div class="tray"></div>

        <div class="layer layer-3">
          <span class="dot" style="left:22%; top:20px; background:#C9A24B;"></span>
          <span class="dot" style="left:48%; top:14px; background:#E4C37E;"></span>
          <span class="dot" style="left:70%; top:22px; background:#C9A24B;"></span>
        </div>
        <div class="layer layer-2">
          <span class="dot" style="left:34%; top:16px; background:#E4C37E;"></span>
          <span class="dot" style="left:60%; top:20px; background:#C9A24B;"></span>
        </div>
        <div class="layer layer-1">
          <span class="dot" style="left:44%; top:14px; background:#E4C37E;"></span>
        </div>

        <div class="candles">
          <div class="candle"><span class="glow"></span><span class="flame"></span><span class="wick"></span><span class="stick"></span></div>
          <div class="candle"><span class="glow"></span><span class="flame"></span><span class="wick"></span><span class="stick"></span></div>
          <div class="candle"><span class="glow"></span><span class="flame"></span><span class="wick"></span><span class="stick"></span></div>
        </div>
      </div>
    </div>

    <p class="tagline">愿你自在飞翔，永远明亮。</p>
  </main>

  <div class="music-hint" id="hint">轻触播放音乐 ♪</div>
  <button class="music" id="music" aria-label="播放音乐">
    <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.3v13.4L19 12z" fill="currentColor"/></svg>
    <svg class="note" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="18" text-anchor="middle" font-size="22" fill="currentColor">♪</text></svg>
  </button>

<script>
(function(){
  /* ============ 可修改内容 ============ */
  const CONFIG = {
    name: 'flying',
    tagline: '愿你自在飞翔，永远明亮。',
  };
  /* ================================== */
  document.getElementById('name').textContent = CONFIG.name;
  document.querySelector('.tagline').textContent = CONFIG.tagline;

  /* ---------- 星星 ---------- */
  for (let i=0;i<46;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2.2;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top  = (Math.random()*100)+'vh';
    s.style.setProperty('--d', (2.4 + Math.random()*3.2)+'s');
    s.style.setProperty('--delay', (Math.random()*4)+'s');
    s.style.setProperty('--op', (0.5 + Math.random()*0.5).toFixed(2));
    document.body.appendChild(s);
  }

  /* ---------- 烟花 ---------- */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = innerWidth; H = innerHeight;
  }
  window.addEventListener('resize', resize); resize();

  const PALETTE = [
    '#FFE9B8','#F5D48C','#FFC76B','#FFF6E0',
    '#E4B95C','#E8A87C','#C9A24B',
  ];

  // 预渲染光点精灵，密集烟花也流畅
  const SPRITES = {};
  function sprite(color){
    if (!SPRITES[color]){
      const s = 64, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
      grad.addColorStop(0, color);
      grad.addColorStop(0.4, color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      SPRITES[color] = c;
    }
    return SPRITES[color];
  }

  class Rocket {
    constructor(){
      this.x = W * (0.12 + Math.random()*0.76);
      this.y = H + 12;
      this.tx = W * (0.15 + Math.random()*0.7);
      this.ty = H * (0.16 + Math.random()*0.3);
      const dx = this.tx - this.x, dy = this.ty - this.y;
      const d = Math.hypot(dx, dy);
      this.vx = dx/d * 10.5;
      this.vy = dy/d * 10.5;
      this.trail = [];
      this.arrived = false;
      this.big = Math.random() < 0.4;
      this.color = this.big ? '#FFE9B8' : '#F5D48C';
    }
    update(){
      this.trail.push({x:this.x, y:this.y});
      if (this.trail.length > 13) this.trail.shift();
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.985; this.vy *= 0.985;
      if (Math.abs(this.x - this.tx) < 9 && Math.abs(this.y - this.ty) < 9) this.arrived = true;
    }
    draw(){
      const n = this.trail.length;
      for (let i=0;i<n;i++){
        const a = (i+1)/n;
        ctx.globalAlpha = a * 0.8;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.trail[i].x, this.trail[i].y, 0.6 + a*1.8, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Particle {
    constructor(x, y, color, angle, speed, size, opts){
      opts = opts || {};
      this.x = x; this.y = y; this.px = x; this.py = y;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.color = color;
      this.size = size;
      this.gravity = opts.gravity !== undefined ? opts.gravity : 0.03;
      this.friction = opts.friction !== undefined ? opts.friction : 0.99;
      this.alpha = 1;
      this.decay = opts.decay !== undefined ? opts.decay : 0.004 + Math.random()*0.008;
    }
    update(){
      this.px = this.x; this.py = this.y;
      this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
      this.x += this.vx; this.y += this.vy;
      this.alpha -= this.decay;
    }
    draw(){
      if (this.alpha <= 0) return;
      const img = sprite(this.color);
      const r = this.size * 2.8;
      ctx.globalAlpha = this.alpha;
      ctx.drawImage(img, this.x - r, this.y - r, r*2, r*2);
      ctx.globalAlpha = this.alpha * 0.4;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = Math.max(0.5, this.size*0.35);
      ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(this.x, this.y); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  let rockets = [], bursts = [];
  function explode(r){
    const main = PALETTE[Math.floor(Math.random()*PALETTE.length)];
    const count = r.big ? 190 : 120;
    const arr = [];
    // 中心爆闪
    arr.push(new Particle(r.x, r.y, '#FFFBE8', 0, 0, 11, { gravity:0, friction:1, decay:0.05 }));
    for (let i=0;i<count;i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.25;
      const speed = r.big ? 1.9 + Math.random()*5.4 : 1.5 + Math.random()*4.5;
      const size = 1.2 + Math.random()*2.2;
      const color = Math.random() < 0.3 ? '#FFF6E0' : main;
      arr.push(new Particle(r.x, r.y, color, angle, speed, size));
    }
    bursts.push(arr);
  }
  function spawn(){ rockets.push(new Rocket()); }

  function loop(){
    ctx.clearRect(0, 0, W, H);
    for (let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.update();
      if (r.arrived){ explode(r); rockets.splice(i,1); }
      else r.draw();
    }
    for (let i=bursts.length-1;i>=0;i--){
      const arr = bursts[i];
      for (let j=0;j<arr.length;j++){ arr[j].update(); arr[j].draw(); }
      if (arr.every(p => p.alpha <= 0)) bursts.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  loop();

  // 齐放：每隔约 2.6 秒，3~4 朵同时升空炸开
  function salvo(){
    const n = 3 + Math.floor(Math.random()*2);
    for (let i=0;i<n;i++) setTimeout(spawn, Math.random()*160);
  }
  salvo();
  setInterval(salvo, 1500);

  /* ---------- 抒情钢琴曲 ---------- */
  const SEMI = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  function noteFreq(name){
    const m = /^([A-G])(#?)(\d)$/.exec(name);
    if(!m) return 440;
    const semi = SEMI[m[1]] + (m[2] === '#' ? 1 : 0);
    const midi = (parseInt(m[3]) + 1) * 12 + semi;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  const BEAT = 0.52;
  const CHORDS = [
    { bass:'A2', arp:['A3','C4','E4'] }, { bass:'F2', arp:['F3','A3','C4'] },
    { bass:'C3', arp:['C3','E3','G3'] }, { bass:'G2', arp:['G3','B3','D4'] },
    { bass:'A2', arp:['A3','C4','E4'] }, { bass:'F2', arp:['F3','A3','C4'] },
    { bass:'G2', arp:['G3','B3','D4'] }, { bass:'C3', arp:['C3','E3','G3'] },
  ];
  const MELODY = [
    ['E5',1],['C5',1],['A4',2], ['A4',1],['C5',1],['D5',2],
    ['E5',2],['C5',2], ['D5',1],['B4',1],['G4',2],
    ['C5',1],['E5',1],['A5',2], ['A5',1],['G5',1],['F5',2],
    ['E5',1],['D5',1],['B4',2], ['C5',4],
  ];

  let audioCtx = null, master = null;
  function ensureCtx(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      master = audioCtx.createGain(); master.gain.value = 0.9;
      const wet = audioCtx.createGain(); wet.gain.value = 0.5;
      const conv = audioCtx.createConvolver();
      conv.buffer = makeImpulse(audioCtx, 2.6, 3);
      master.connect(audioCtx.destination);
      master.connect(wet); wet.connect(conv); conv.connect(audioCtx.destination);
    }
    return audioCtx;
  }
  function makeImpulse(ctx, seconds, decay){
    const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
    return buf;
  }
  function piano(freq, start, dur, vol){
    const ctx = audioCtx;
    [[1,1],[2,.36],[3,.16],[4,.06]].forEach(([ratio,g]) => {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = freq * ratio;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(0, start);
      gn.gain.linearRampToValueAtTime(vol*g, start + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0005, start + dur);
      o.connect(gn); gn.connect(master);
      o.start(start); o.stop(start + dur + 0.1);
    });
  }
  function playSong(){
    const ctx = ensureCtx();
    const t0 = ctx.currentTime + 0.15;
    CHORDS.forEach((ch, idx) => {
      const start = t0 + idx * 4 * BEAT;
      piano(noteFreq(ch.bass), start, 4*BEAT*0.98, 0.20);
      [0,1,2,1,0,1,2,1].forEach((k, j) => {
        piano(noteFreq(ch.arp[k]), start + j*0.5*BEAT, 0.5*BEAT*1.5, 0.09);
      });
    });
    let t = t0;
    MELODY.forEach(([n,d]) => { piano(noteFreq(n), t, d*BEAT*1.2, 0.30); t += d*BEAT; });
    return t0 + 32*BEAT;
  }

  let playing = false, loopTimer = null;
  const btn = document.getElementById('music');
  const hint = document.getElementById('hint');
  function updateUI(){
    btn.classList.toggle('playing', playing);
    btn.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');
    hint.classList.remove('show');
  }
  function startLoop(){
    if (playing) return;
    playing = true; updateUI();
    const end = playSong();
    const wait = Math.max(0, (end - ensureCtx().currentTime)*1000) + 2200;
    loopTimer = setTimeout(startLoop, wait);
  }
  function stopLoop(){ playing = false; updateUI(); clearTimeout(loopTimer); }
  btn.addEventListener('click', () => { ensureCtx().resume(); playing ? stopLoop() : startLoop(); });

  window.addEventListener('load', () => {
    const ctx = ensureCtx();
    if (ctx.state === 'running') startLoop();
    else {
      hint.classList.add('show');
      const unlock = () => {
        ensureCtx().resume().then(() => { if (!playing) startLoop(); });
        document.removeEventListener('pointerdown', unlock);
        document.removeEventListener('keydown', unlock);
      };
      document.addEventListener('pointerdown', unlock);
      document.addEventListener('keydown', unlock);
    }
  });
})();
</script>
</body>
</html>
